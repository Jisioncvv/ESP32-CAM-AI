; =====================================================================
; PlatformIO 工程配置：ESP32-S3 立创开发板 FreeRTOS 摄像头应用（精简基础版）
; 硬件：OV5640 摄像头 + WiFi AP + TF 卡 + 闪光灯 LED GPIO6 + 4 按键
; 功能：LCD 预览 / 拍照存卡 / 相册（Web 端拍照、相册查看保留）
; =====================================================================

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; N8R8 模组：8MB Quad Flash + 8MB Octal PSRAM
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 8MB

; 启用 PSRAM 编译宏 + USB-Serial/JTAG 串口输出
; TFT_eSPI 屏幕配置：通过 -D 宏直接注入（USER_SETUP_LOADED 跳过库内 User_Setup.h），
; 引脚沿用参照工程判断：SCK=5, MOSI=2, CS=3, DC=4, RST=-1, BL=1（ST7789 240x320）
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSER_SETUP_LOADED=1
    -DUSE_FSPI_PORT=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MOSI=2
    -DTFT_SCLK=5
    -DTFT_CS=3
    -DTFT_DC=4
    -DTFT_RST=-1
    -DTFT_BL=1
    -DTFT_BACKLIGHT_ON=HIGH
    -DTFT_INVERSION_ON=1
    -DTFT_RGB_ORDER=TFT_BGR
    -DTOUCH_CS=-1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DSPI_FREQUENCY=80000000
    -DSPI_READ_FREQUENCY=40000000

; 深度依赖解析（确保 esp_camera 等组件正确链接）
lib_ldf_mode = deep+

; 依赖库：TFT_eSPI（屏幕驱动）+ TJpg_Decoder（相册 JPEG 解码，官方同款）
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    bodmer/TJpg_Decoder @ ^1.1.0
    bitbank2/JPEGDEC @ ^1.5.3

; 串口监视器
monitor_speed = 115200
